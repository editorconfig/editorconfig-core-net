# Keeps the next release's draft up to date from the labels of merged pull requests. Publishing the draft releases.
name: release-drafter

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-drafter
    permissions:
      contents: write # create and edit the draft release
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
