# Reports what a pull request changes in the public API of the libraries, with assembly-differ: a comment, a release
# label (breaking, feature), and a failing check on a breaking change until the pull request gets the
# breaking-allowed label. labeled and unlabeled run it again when someone adds or removes that label.
name: api-changes

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  api-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # the comment and the labels
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - run: dotnet build -c Release

      - uses: nullean/assembly-differ@378f3c1e2a83c166ce69e06be1764a5467b572d1 # v1
